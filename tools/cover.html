<!doctype html><html><head><meta charset="utf-8"><style>
*{box-sizing:border-box;margin:0}
body{width:1600px;height:1000px;font-family:'Segoe UI','Yu Gothic',sans-serif;background:#F4F1EA;position:relative;overflow:hidden}
.band{position:absolute;left:0;top:0;width:100%;height:18px;background:#1F3A5F}
.sun{position:absolute;right:120px;top:110px;width:260px;height:260px;border-radius:50%;background:#C8372D}
.wrap{position:absolute;left:110px;top:150px;width:900px}
.tag{font-size:30px;letter-spacing:4px;color:#C8372D;font-weight:700;margin-bottom:28px}
h1{font-size:104px;line-height:1.05;color:#1F3A5F;font-weight:800}
.sub{font-size:38px;color:#444;margin-top:34px;line-height:1.35}
.chips{position:absolute;left:110px;bottom:130px;display:flex;gap:18px}
.chip{background:#1F3A5F;color:#fff;font-size:30px;padding:16px 28px;border-radius:40px;font-weight:600}
.chip.o{background:#fff;color:#1F3A5F;border:3px solid #1F3A5F}
.foot{position:absolute;left:110px;bottom:50px;font-size:26px;color:#666}
.card{position:absolute;right:110px;bottom:120px;width:380px;background:#fff;border-radius:18px;padding:30px 34px;box-shadow:0 10px 30px rgba(0,0,0,.15);font-size:27px;color:#333;line-height:1.7}
.card b{color:#1F3A5F;display:block;font-size:30px;margin-bottom:6px}
</style></head><body>
<div class="band"></div><div class="sun"></div>
<div class="wrap"><div class="tag">PRACTICAL GUIDE 2026</div>
<h1>Renting an Apartment in Japan</h1>
<div class="sub">Costs, contracts, email templates and move-in steps for foreigners</div></div>
<div class="card"><b>Inside</b>✓ Illustrated PDF guide<br>✓ Excel cost calculator<br>✓ 6 copy-paste emails<br>✓ Checklists &amp; glossary</div>
<div class="chips"><div class="chip">PDF</div><div class="chip">Excel</div><div class="chip o">Instant download</div></div>
<div class="foot">Japan Living Notes</div>
</body></html>
